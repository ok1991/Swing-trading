name: Swing V4 Tests

on:
  schedule:
    # GitHub Actions cron is UTC. This is 18:00 Asia/Shanghai every day.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: swing-v4-tests
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

